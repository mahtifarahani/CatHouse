# Publishes platform VSIX files to GitHub Releases and Open VSX. Push a stable
# tag vX.Y.Z that matches packages/extension/package.json
# and a "## [X.Y.Z]" section in docs/CHANGELOG.md. See docs/release/github.md.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Check the tag against the changelog
        run: node scripts/release-notes.mjs --tag "${RELEASE_TAG}" --out release-notes.md

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build every platform VSIX
        run: pnpm package:all

      - name: Checksums
        run: |
          set -euo pipefail
          count="$(find dist -name 'cathouse-*.vsix' | wc -l | tr -d ' ')"
          test "$count" = "4"
          (cd dist && sha256sum -- *.vsix > SHA256SUMS)

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists; keeping its assets unchanged."
            exit 0
          fi
          args=(--title "CatHouse ${RELEASE_TAG}" --notes-file release-notes.md)
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" dist/*.vsix dist/SHA256SUMS "${args[@]}"

      - name: Check Open VSX credentials
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          test -n "${OVSX_PAT:-}" || { echo "::error::Repository secret OVSX_PAT is missing"; exit 1; }

      - name: Publish to Open VSX
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          pnpm dlx ovsx@1.2.0 publish \
            --packagePath dist/*.vsix \
            --skip-duplicate
